<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C 登入</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:#0B5A54}a:hover{color:#0F766E}
</style>
</head>
<body>
<div style="min-height: 800px; display: flex; flex-wrap: wrap; background: #F1F5F4; color: #1F2937; font-family: 'Noto Sans TC', sans-serif; font-size: 16px; line-height: 1.6">
<div style="flex: 1 1 420px; box-sizing: border-box; padding: 64px 56px; background: #0F766E; color: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between; gap: 40px">
<div style="font-size: 22px; font-weight: 700">天星教育</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-size: 40px; font-weight: 700; line-height: 1.3">每一位學生的升學路，<br>都在這裡有條有理。</h1>
<div style="font-size: 17px; color: #D5EFEB">案件、學校資料、任務與文件，集中在同一個工作台。</div>
</div>
<div style="font-size: 14px; color: #D5EFEB">天星教育內部系統</div>
</div>
<div style="flex: 1 1 420px; box-sizing: border-box; padding: 64px 40px; display: flex; align-items: center; justify-content: center">
<form style="width: 100%; max-width: 400px; box-sizing: border-box; padding: 40px; background: #FFFFFF; border-radius: 16px; box-shadow: 0 2px 8px rgba(31,41,55,0.06); display: flex; flex-direction: column; gap: 20px">
<div>
<h2 style="margin: 0; font-size: 26px; font-weight: 700">登入</h2>
<div style="color: #4B5563">使用公司發給你的帳號</div>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #4B5563">電郵地址
<input type="email" placeholder="name@example.com" style="height: 48px; box-sizing: border-box; padding: 0 16px; border: 1px solid #C5CFCD; border-radius: 12px; font: inherit; font-size: 16px; color: #1F2937"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #4B5563">密碼
<input type="password" style="height: 48px; box-sizing: border-box; padding: 0 16px; border: 1px solid #C5CFCD; border-radius: 12px; font: inherit; font-size: 16px; color: #1F2937"></label>
<button type="button" style="height: 52px; border: 0; border-radius: 999px; background: #0F766E; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 700">登入</button>
<div style="font-size: 14px; color: #4B5563; text-align: center">忘記密碼？請聯絡管理員重設。</div>
</form>
</div>
</div>
</body>
</html>
